# Builds Vanity on every push. The build log and the finished jar are also
# force-pushed to the `build-output` branch so they can be read with plain git.
name: build

on:
  push:
    branches-ignore: [build-output, test-output]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: setup jdk 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: setup gradle (caches downloaded dependencies between runs)
        uses: gradle/actions/setup-gradle@v6

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          # Maven Central sometimes rate-limits GitHub runners (HTTP 429). Retry only download failures.
          for attempt in 1 2 3 4; do
            if ./gradlew build --stacktrace --warning-mode all 2>&1 | tee build.log; then
              exit 0
            fi
            if ! grep -qE "status code 429|Could not GET|Could not HEAD|Read timed out|Connection reset" build.log; then
              exit 1
            fi
            echo "::warning::Dependency download failed on attempt $attempt, retrying"
            sleep $((attempt * 45))
          done
          exit 1

      - name: collect errors
        if: always()
        run: |
          grep -nE "error:|warning:|FAILED|BUILD (SUCCESSFUL|FAILED)|What went wrong|Could not|Exception" build.log | head -300 > errors.txt || true

      - name: publish results to build-output branch
        if: always()
        run: |
          mkdir -p out
          cp build.log errors.txt out/ || true
          cp build/libs/*.jar out/ 2>/dev/null || true
          echo "${{ steps.build.outcome }}" > out/STATUS
          echo "${GITHUB_SHA}" > out/COMMIT
          cd out
          git init -q -b build-output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Build of ${GITHUB_SHA}: ${{ steps.build.outcome }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-output

      - name: upload jar
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vanity-jar
          path: build/libs/
          if-no-files-found: ignore

      - name: fail if the build failed
        if: steps.build.outcome != 'success'
        run: exit 1

  # Starts a real Minecraft client in a virtual display, puts cosmetics on the
  # player and takes screenshots. Results go to the `test-output` branch.
  client_test:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: setup jdk 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6

      - name: install virtual display and software graphics drivers
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-vulkan-drivers libgl1-mesa-dri

      - name: run client game test
        id: test
        continue-on-error: true
        timeout-minutes: 25
        run: |
          chmod +x ./gradlew
          set -o pipefail
          for attempt in 1 2 3; do
            if xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew runClientGameTest --stacktrace 2>&1 | tee test.log; then
              exit 0
            fi
            if ! grep -qE "status code 429|Could not GET|Could not HEAD|Read timed out|Connection reset" test.log; then
              exit 1
            fi
            echo "::warning::Dependency download failed on attempt $attempt, retrying"
            sleep $((attempt * 45))
          done
          exit 1

      - name: publish results to test-output branch
        if: always()
        run: |
          mkdir -p out/screenshots
          cp test.log out/ || true
          cp build/run/clientGameTest/screenshots/*.png out/screenshots/ 2>/dev/null || true
          cp build/run/clientGameTest/logs/latest.log out/game-latest.log 2>/dev/null || true
          cp -r build/run/clientGameTest/crash-reports out/ 2>/dev/null || true
          echo "${{ steps.test.outcome }}" > out/STATUS
          echo "${GITHUB_SHA}" > out/COMMIT
          cd out
          git init -q -b test-output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Client test of ${GITHUB_SHA}: ${{ steps.test.outcome }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" test-output

      - name: fail if the test failed
        if: steps.test.outcome != 'success'
        run: exit 1
