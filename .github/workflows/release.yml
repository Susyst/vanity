# Pushing a tag like v0.10.0 builds Vanity and publishes a GitHub release with the jar.
# Release notes come from changelog/<version>.md.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: setup jdk 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6

      - name: check tag matches mod_version
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match mod_version $version"
            exit 1
          fi
          test -f "changelog/$version.md" || { echo "::error::Missing changelog/$version.md"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: build
        run: |
          chmod +x ./gradlew
          set -o pipefail
          for attempt in 1 2 3 4; do
            if ./gradlew build --stacktrace 2>&1 | tee build.log; then
              exit 0
            fi
            if ! grep -qE "status code 429|Could not GET|Could not HEAD|Read timed out|Connection reset" build.log; then
              exit 1
            fi
            echo "::warning::Dependency download failed on attempt $attempt, retrying"
            sleep $((attempt * 45))
          done
          exit 1

      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/libs/vanity-$VERSION.jar" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Vanity $VERSION for Minecraft 26.3" \
            --notes-file "changelog/$VERSION.md" \
            --latest
